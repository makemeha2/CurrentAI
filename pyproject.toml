[project]
name = "current-ai"
version = "0.1.0"
description = "AI test backend"
requires-python = "==3.13.2"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "anthropic",
  "rich",
  "tenacity>=9.1.2",
  "python-multipart>=0.0.21",
  "langchain[anthropic,openai]>=1.2.1",
  "numpy>=2.4.1",
  "langchain-community>=0.4.1",
  "faiss-cpu>=1.13.2",
  "unstructured>=0.18.27",
  "duckduckgo-search>=8.1.1",
  "ddgs>=9.10.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ruff>=0.14.10",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
